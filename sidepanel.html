<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>组备份</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <div class="seg" role="tablist" aria-label="分区">
      <button id="view-active" type="button" class="view is-selected">当前</button>
      <button id="view-saved" type="button" class="view">已保存 <span id="slot-count" class="badge">0</span></button>
    </div>
    <button id="open-settings" type="button" class="icon-btn" aria-label="设置">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>
  <div id="toolbar" class="toolbar"></div>
  <main id="panel">
    <div id="search-results"></div>
    <p id="banner" class="banner" hidden></p>
    <section id="active-view"></section>
    <section id="saved-view" hidden>
      <div id="session-list"></div>
      <div class="section-row">
        <h2 class="section">分组备份</h2>
        <p id="backup-quota">0</p>
      </div>
      <div id="backup-list"></div>
    </section>
    <section id="settings-view" hidden></section>
    <div id="overlay"></div>
  </main>
  <div id="dock" hidden></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
